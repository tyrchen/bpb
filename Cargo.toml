[package]
name = "bpb"
description = "boats's personal barricade"
license = "MIT OR Apache-2.0"
version = "1.4.0"
repository = "https://github.com/withoutboats/bpb"
edition = "2024"
authors = ["Without Boats <boats@mozilla.com>"]

[dependencies]
toml = "0.8"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
thiserror = "2.0"
anyhow = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[dependencies.pbp]
version = "0.7.0"
git = "https://github.com/tyrchen/pbp"
tag = "v0.7.0"
features = ["dalek"]
